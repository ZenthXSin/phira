name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: v0.7.1
      version:
        description: Version used in the IPA filename
        required: true
        default: 0.7.1

jobs:
  build:
    name: iOS IPA
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          targets: aarch64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Archive unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project phira.xcodeproj \
            -scheme phira \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Phira.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        env:
          IPA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Phira.xcarchive/Products/Applications/Phira.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/Phira.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "Phira-v${IPA_VERSION}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Phira-v${{ inputs.version }}-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Phira-v${{ inputs.version }}-unsigned.ipa
          if-no-files-found: error
