name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: v0.7.1
      version:
        description: Version used in the IPA filename
        required: true
        default: 0.7.1

jobs:
  build:
    name: iOS IPA
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          targets: aarch64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Archive unsigned app
        run: |
          set -euo pipefail
          # The FFmpeg archives downloaded by prpr-avc live outside Cargo's
          # cache. Remove cached build-script outputs so they are downloaded
          # again on a fresh GitHub runner.
          rm -rf target/xcode prpr-avc/static-lib
          ffmpeg_dir="$PWD/prpr-avc/static-lib/aarch64-apple-ios"
          mkdir -p "$ffmpeg_dir"
          curl --fail --location --retry 3 \
            "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/20260730_v0/aarch64-apple-ios.tar.gz" \
            | tar -xzf - -C "$ffmpeg_dir"
          printf '20260730_v0\n' > "$ffmpeg_dir/.version"
          export PRPR_AVC_LIBS="$PWD/prpr-avc/static-lib"
          # v0.7.1 uses PathBuf in its iOS export branch but omits the import.
          sed -i '' 's/path::Path,/path::{Path, PathBuf},/' phira/src/page/library.rs
          xcodebuild \
            -project phira.xcodeproj \
            -scheme phira \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Phira.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        env:
          IPA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Phira.xcarchive/Products/Applications/Phira.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/Phira.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "Phira-v${IPA_VERSION}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Phira-v${{ inputs.version }}-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Phira-v${{ inputs.version }}-unsigned.ipa
          if-no-files-found: error
